<!-- Duyên Sở Thích — ứng dụng kết nối người cùng sở thích -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3EC;        /* nền giấy ấm ngả hồng đào */
    --paper-2:#FFFBF7;      /* nền thẻ sáng hơn */
    --ink:#3B2830;          /* mực nâu mận đậm */
    --ink-soft:#7A6570;     /* chữ phụ */
    --thread:#C8385A;       /* đỏ tơ hồng - điểm nhấn chính */
    --thread-deep:#9E2745;  /* đỏ đậm */
    --plum:#4E2438;         /* mận rượu - tiêu đề */
    --sage:#7F9A82;         /* xanh rêu dịu - cân bằng */
    --gold:#C79A44;         /* vàng cổ - vi điểm nhấn */
    --blush:#F0D5C8;        /* hồng phấn */
    --line:#E8D6CB;         /* đường kẻ mảnh */
    --danger:#B23A48;
    --shadow:0 10px 30px -12px rgba(78,36,56,.28);
    --shadow-sm:0 4px 14px -8px rgba(78,36,56,.35);
    --r:18px;
    --display:"Fraunces",Georgia,"Times New Roman",serif;
    --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  /* ---------- khung ---------- */
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  header.top{position:sticky;top:0;z-index:50;background:rgba(251,243,236,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;max-width:1080px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
  .brand .knot{width:30px;height:30px;flex:0 0 auto}
  .brand b{font-family:var(--display);font-weight:600;font-size:1.32rem;letter-spacing:.2px;color:var(--plum)}
  .brand small{display:block;font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--thread);font-weight:600;margin-top:-3px}
  nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
  nav.tabs button{font-family:var(--body);font-size:.86rem;font-weight:600;color:var(--ink-soft);background:none;border:0;padding:9px 14px;border-radius:999px;cursor:pointer;transition:all .18s}
  nav.tabs button:hover{color:var(--plum);background:rgba(200,56,90,.07)}
  nav.tabs button.active{color:#fff;background:var(--thread)}
  nav.tabs button:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
  .me-chip{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-soft)}
  .me-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--sage)}

  main{padding:34px 0 80px}
  h1,h2,h3{font-family:var(--display);color:var(--plum);font-weight:600;line-height:1.12}
  .eyebrow{font-size:.68rem;letter-spacing:3.5px;text-transform:uppercase;color:var(--thread);font-weight:700;margin:0 0 10px}

  /* ---------- hero ---------- */
  .hero{position:relative;text-align:center;padding:26px 0 8px;overflow:hidden}
  .hero h1{font-size:clamp(2.3rem,6vw,3.9rem);margin:.1em 0 .25em}
  .hero h1 em{font-style:italic;color:var(--thread);position:relative}
  .hero p.lead{max-width:560px;margin:0 auto 22px;color:var(--ink-soft);font-size:1.05rem}
  .thread-svg{display:block;width:100%;max-width:720px;margin:6px auto 0;height:70px}
  .thread-svg path{fill:none;stroke:var(--thread);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease forwards .2s}
  .thread-svg circle{fill:var(--thread);opacity:0;animation:pop .5s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{to{opacity:1}}
  .cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}

  /* ---------- nút ---------- */
  .btn{font-family:var(--body);font-weight:600;font-size:.92rem;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;display:inline-flex;align-items:center;gap:8px}
  .btn:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
  .btn.primary{background:var(--thread);color:#fff;box-shadow:var(--shadow-sm)}
  .btn.primary:hover{background:var(--thread-deep);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--plum);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--thread);color:var(--thread)}
  .btn.sage{background:var(--sage);color:#fff}
  .btn.sage:hover{filter:brightness(.95);transform:translateY(-1px)}
  .btn.sm{padding:8px 15px;font-size:.82rem}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  /* ---------- lưới thẻ hồ sơ ---------- */
  .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:40px 0 20px;flex-wrap:wrap}
  .section-head h2{font-size:1.7rem;margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .card .ava{height:184px;background:linear-gradient(135deg,var(--blush),#f7e6dc);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .card .ava img{width:100%;height:100%;object-fit:cover}
  .card .ava .emoji{font-size:4.6rem}
  .card .ava .age{position:absolute;bottom:10px;right:10px;background:rgba(59,40,48,.72);color:#fff;font-size:.74rem;font-weight:600;padding:3px 10px;border-radius:999px;backdrop-filter:blur(4px)}
  .card .body{padding:15px 16px 17px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{font-size:1.16rem;margin:0}
  .card .job{font-size:.82rem;color:var(--sage);font-weight:600;margin:-4px 0 0}
  .card .meta{font-size:.78rem;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tag{font-size:.72rem;font-weight:600;color:var(--thread-deep);background:rgba(200,56,90,.09);border:1px solid rgba(200,56,90,.16);padding:3px 9px;border-radius:999px}
  .card .bio{font-size:.83rem;color:var(--ink-soft);margin:0}
  .card .foot{margin-top:auto;padding-top:6px}

  /* ---------- form ---------- */
  .panel{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:26px;max-width:640px;margin:0 auto}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.82rem;font-weight:600;color:var(--plum);margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--ink-soft);font-size:.76rem}
  input[type=text],input[type=number],input[type=email],input[type=password],textarea,select{
    width:100%;font-family:var(--body);font-size:.95rem;color:var(--ink);background:#fff;
    border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;transition:border .15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--thread)}
  textarea{resize:vertical;min-height:78px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.two{grid-template-columns:1fr}}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:.83rem;font-weight:600;color:var(--ink-soft);background:#fff;border:1.5px solid var(--line);padding:7px 13px;border-radius:999px;cursor:pointer;transition:all .15s;user-select:none}
  .chip:hover{border-color:var(--thread)}
  .chip.on{background:var(--thread);color:#fff;border-color:var(--thread)}

  /* avatar uploader */
  .ava-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ava-prev{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--blush),#f7e6dc);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden;border:2px solid var(--line);flex:0 0 auto}
  .ava-prev img{width:100%;height:100%;object-fit:cover}
  .emoji-row{display:flex;gap:6px;flex-wrap:wrap}
  .emoji-row button{font-size:1.4rem;background:#fff;border:1.5px solid var(--line);border-radius:12px;width:44px;height:44px;cursor:pointer;transition:all .15s}
  .emoji-row button:hover{border-color:var(--thread)}
  .emoji-row button.on{border-color:var(--thread);background:rgba(200,56,90,.09)}

  /* ---------- kết nối / founder ---------- */
  .req-item,.match-item,.notif-item{display:flex;align-items:center;gap:14px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:10px}
  .req-item .av,.match-item .av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blush),#f7e6dc);font-size:1.5rem}
  .req-item .av img,.match-item .av img{width:100%;height:100%;object-fit:cover}
  .req-item .txt,.match-item .txt{flex:1;min-width:0}
  .req-item .txt b,.match-item .txt b{color:var(--plum)}
  .req-item .txt small,.match-item .txt small{color:var(--ink-soft);font-size:.78rem}
  .req-actions{display:flex;gap:8px;flex-wrap:wrap}
  .match-pair{display:flex;align-items:center;gap:6px}
  .match-pair .heart{color:var(--thread);font-size:1.1rem}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .n{font-family:var(--display);font-size:2rem;color:var(--thread);line-height:1}
  .stat .l{font-size:.76rem;color:var(--ink-soft);margin-top:5px}

  .empty{text-align:center;color:var(--ink-soft);padding:46px 20px;border:1.5px dashed var(--line);border-radius:var(--r)}
  .empty .big{font-size:2.4rem;margin-bottom:8px}

  .notice{font-size:.82rem;color:var(--ink-soft);background:rgba(127,154,130,.12);border:1px solid rgba(127,154,130,.28);border-radius:12px;padding:11px 14px;margin-bottom:16px}
  .notice b{color:var(--sage)}

  /* toast */
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:var(--plum);color:#fff;padding:12px 20px;border-radius:999px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);z-index:200;transition:transform .3s;max-width:90vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}

  .loading{text-align:center;color:var(--ink-soft);padding:50px}
  footer{text-align:center;color:var(--ink-soft);font-size:.78rem;padding:30px 20px;border-top:1px solid var(--line)}
  footer .knot{width:22px;vertical-align:middle;opacity:.7;margin:0 4px}
</style>

<header class="top">
  <div class="topbar">
    <div class="brand" onclick="go('home')">
      <svg class="knot" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M8 20c6-9 18-9 24 0-6 9-18 9-24 0z" fill="none" stroke="#C8385A" stroke-width="2.6"/>
        <circle cx="20" cy="20" r="3.4" fill="#C8385A"/>
      </svg>
      <div><b>Duyên Sở Thích</b><small>Se duyên đồng điệu</small></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-v="home" class="active">Trang chủ</button>
      <button data-v="create">Tạo hồ sơ</button>
      <button data-v="search">Tìm kiếm</button>
      <button data-v="connect">Kết nối</button>
      <button data-v="founder">Founder</button>
    </nav>
  </div>
</header>

<main><div class="wrap" id="app"><div class="loading">Đang tải…</div></div></main>

<footer>
  Duyên Sở Thích
  <svg class="knot" viewBox="0 0 40 40"><path d="M8 20c6-9 18-9 24 0-6 9-18 9-24 0z" fill="none" stroke="#C8385A" stroke-width="2.6"/><circle cx="20" cy="20" r="3.4" fill="#C8385A"/></svg>
  nơi những tâm hồn đồng điệu tìm thấy nhau
</footer>
<div id="toast"></div>

<script>
/* ============ CẤU HÌNH ============ */
const INTERESTS = ["Du lịch","Ẩm thực","Nhiếp ảnh","Đọc sách","Âm nhạc","Cà phê","Phượt xe máy",
  "Yoga","Nấu ăn","Phim ảnh","Khiêu vũ","Thiện nguyện","Làm vườn","Thú cưng","Công nghệ",
  "Ngoại ngữ","Thiền","Hội hoạ","Boardgame","Thể thao","Leo núi","Viết lách"];
const EMOJIS = ["🌸","🌿","🌻","🦋","☕","🎸","📚","🐈","🎨","⛰️","🍜","🌙"];

/* ============ STORAGE HELPERS ============ */
async function sGet(k,shared=true){ try{ const r=await window.storage.get(k,shared); return r?r.value:null; }catch(e){ return null; } }
async function sSet(k,v,shared=true){ try{ return await window.storage.set(k,typeof v==='string'?v:JSON.stringify(v),shared);}catch(e){ toast('Lưu chưa được, thử lại nhé'); return null; } }
async function sDel(k,shared=true){ try{ return await window.storage.delete(k,shared);}catch(e){ return null; } }
async function sList(prefix,shared=true){ try{ const r=await window.storage.list(prefix,shared); return r?r.keys:[]; }catch(e){ return []; } }
function j(v,d){ try{ return v?JSON.parse(v):d; }catch(e){ return d; } }

/* ============ STATE ============ */
let ME=null;      // hồ sơ của thiết bị này (personal storage)
let VIEW='home';

/* ============ TIỆN ÍCH ============ */
const $=s=>document.querySelector(s);
const app=()=>$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function uid(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function avatarHTML(p,cls=''){ if(p.avatar&&p.avatar.startsWith('data:')) return `<img class="${cls}" src="${p.avatar}" alt="">`; return `<span class="emoji">${p.avatar||'🌸'}</span>`; }

/* ============ ĐIỀU HƯỚNG ============ */
function go(v){ VIEW=v; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.v===v)); window.scrollTo(0,0); render(); }
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));

async function render(){
  if(VIEW==='home') return renderHome();
  if(VIEW==='create') return renderCreate();
  if(VIEW==='search') return renderSearch();
  if(VIEW==='connect') return renderConnect();
  if(VIEW==='founder') return renderFounder();
}

/* ============ TẢI HỒ SƠ ============ */
async function loadProfiles(){
  const keys=await sList('profile:');
  const out=[];
  for(const k of keys){ const p=j(await sGet(k),null); if(p) out.push(p); }
  return out.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

/* ============ TRANG CHỦ ============ */
async function renderHome(){
  app().innerHTML=`
  <section class="hero">
    <p class="eyebrow">Ứng dụng se duyên theo sở thích</p>
    <h1>Người <em>đồng điệu</em><br>luôn ở đâu đó chờ ta</h1>
    <p class="lead">Tạo hồ sơ, khoe sở thích của bạn, tìm người cùng tần số — từ tri kỷ đến bạn đời. Mỗi kết nối là một sợi chỉ đỏ.</p>
    <div class="cta-row">
      <button class="btn primary" onclick="go('create')">✿ Tạo hồ sơ của tôi</button>
      <button class="btn ghost" onclick="go('search')">Tìm theo sở thích</button>
    </div>
    <svg class="thread-svg" viewBox="0 0 720 70" aria-hidden="true">
      <path d="M20 35 C 140 -10, 220 80, 360 35 S 580 -10, 700 35"/>
      <circle cx="20" cy="35" r="5" style="animation-delay:.3s"/>
      <circle cx="360" cy="35" r="5" style="animation-delay:1.3s"/>
      <circle cx="700" cy="35" r="5" style="animation-delay:2.4s"/>
    </svg>
  </section>
  <div class="section-head"><h2>Thành viên mới</h2><span id="count" class="me-chip"></span></div>
  <div id="ppl"><div class="loading">Đang tải hồ sơ…</div></div>`;
  const list=await loadProfiles();
  $('#count').innerHTML=`<span class="dot"></span> ${list.length} hồ sơ`;
  $('#ppl').innerHTML = list.length ? `<div class="grid">${list.map(cardHTML).join('')}</div>`
    : `<div class="empty"><div class="big">🌱</div>Chưa có ai cả — hãy là người đầu tiên gieo duyên!<br><br><button class="btn primary" onclick="go('create')">Tạo hồ sơ ngay</button></div>`;
}

function cardHTML(p){
  const mine = ME && ME.id===p.id;
  const tags=(p.interests||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  return `<div class="card">
    <div class="ava">${avatarHTML(p)}${p.age?`<span class="age">${esc(p.age)} tuổi</span>`:''}</div>
    <div class="body">
      <h3>${esc(p.name)} ${mine?'<span style="font-size:.7rem;color:var(--sage)">(bạn)</span>':''}</h3>
      ${p.job?`<p class="job">${esc(p.job)}</p>`:''}
      ${p.area?`<p class="meta">📍 ${esc(p.area)}</p>`:''}
      <div class="tags">${tags}</div>
      ${p.bio?`<p class="bio">${esc(p.bio)}</p>`:''}
      <div class="foot">${mine?'<button class="btn ghost sm" disabled>Đây là bạn</button>':`<button class="btn primary sm" onclick="sendReq('${p.id}')">✉ Kết bạn</button>`}</div>
    </div>
  </div>`;
}

/* ============ TẠO HỒ SƠ ============ */
let draftInterests=new Set(), draftAvatar='🌸';
async function renderCreate(){
  if(ME){ draftInterests=new Set(ME.interests||[]); draftAvatar=ME.avatar||'🌸'; }
  const p=ME||{};
  app().innerHTML=`
  <p class="eyebrow" style="text-align:center">${ME?'Cập nhật hồ sơ':'Tạo hồ sơ'}</p>
  <h1 style="text-align:center;font-size:2.2rem;margin:.1em 0 1.1em">Giới thiệu về bạn</h1>
  <div class="panel">
    <div class="notice">🔒 <b>Riêng tư:</b> chỉ nên ghi <b>khu vực/tỉnh thành</b>, đừng ghi địa chỉ nhà chi tiết. Hãy hẹn gặp lần đầu ở nơi công cộng nhé.</div>

    <div class="field">
      <label>Ảnh đại diện</label>
      <div class="ava-pick">
        <div class="ava-prev" id="avaPrev">${draftAvatar.startsWith('data:')?`<img src="${draftAvatar}">`:draftAvatar}</div>
        <div>
          <input type="file" id="avaFile" accept="image/*" style="font-size:.8rem;margin-bottom:8px">
          <div class="hint" style="margin-bottom:6px">…hoặc chọn biểu tượng:</div>
          <div class="emoji-row" id="emojiRow">${EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${draftAvatar===e?'on':''}">${e}</button>`).join('')}</div>
        </div>
      </div>
    </div>

    <div class="two">
      <div class="field"><label>Họ và tên *</label><input type="text" id="fName" value="${esc(p.name||'')}" placeholder="Nguyễn An"></div>
      <div class="field"><label>Tuổi *</label><input type="number" id="fAge" min="18" max="99" value="${esc(p.age||'')}" placeholder="28"></div>
    </div>
    <div class="two">
      <div class="field"><label>Công việc</label><input type="text" id="fJob" value="${esc(p.job||'')}" placeholder="Giáo viên"></div>
      <div class="field"><label>Khu vực / Tỉnh thành</label><input type="text" id="fArea" value="${esc(p.area||'')}" placeholder="Rạch Giá, Kiên Giang"></div>
    </div>

    <div class="field">
      <label>Sở thích <span class="hint">(chọn vài mục — càng rõ càng dễ gặp người hợp)</span></label>
      <div class="chips" id="chips">${INTERESTS.map(i=>`<span class="chip ${draftInterests.has(i)?'on':''}" data-i="${esc(i)}">${esc(i)}</span>`).join('')}</div>
    </div>

    <div class="field"><label>Đôi lời giới thiệu</label><textarea id="fBio" placeholder="Mình thích những buổi sáng cà phê và một cuốn sách hay…">${esc(p.bio||'')}</textarea></div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      <button class="btn primary" id="saveBtn">✿ ${ME?'Lưu thay đổi':'Đăng hồ sơ'}</button>
      ${ME?'<button class="btn ghost" onclick="go(\'home\')">Huỷ</button>':''}
    </div>
  </div>`;

  // sự kiện chọn emoji
  $('#emojiRow').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    draftAvatar=b.dataset.e;
    $('#emojiRow').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    $('#avaPrev').innerHTML=draftAvatar;
  }));
  // chọn chip
  $('#chips').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    const i=c.dataset.i; if(draftInterests.has(i)){draftInterests.delete(i);c.classList.remove('on');} else {draftInterests.add(i);c.classList.add('on');}
  }));
  // upload ảnh -> resize -> base64
  $('#avaFile').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement('canvas'); const S=240;
        const scale=Math.max(S/img.width,S/img.height);
        cv.width=S;cv.height=S;
        const ctx=cv.getContext('2d');
        ctx.drawImage(img,(S-img.width*scale)/2,(S-img.height*scale)/2,img.width*scale,img.height*scale);
        draftAvatar=cv.toDataURL('image/jpeg',0.8);
        $('#avaPrev').innerHTML=`<img src="${draftAvatar}">`;
        $('#emojiRow').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(f);
  });
  $('#saveBtn').addEventListener('click',saveProfile);
}

async function saveProfile(){
  const name=$('#fName').value.trim(), age=$('#fAge').value.trim();
  if(!name){ toast('Bạn chưa nhập họ tên'); return; }
  if(!age||+age<18){ toast('Tuổi phải từ 18 trở lên'); return; }
  const btn=$('#saveBtn'); btn.disabled=true; btn.textContent='Đang lưu…';
  const id = ME ? ME.id : uid();
  const p={ id, name, age:+age, job:$('#fJob').value.trim(), area:$('#fArea').value.trim(),
    interests:[...draftInterests], bio:$('#fBio').value.trim(), avatar:draftAvatar,
    createdAt: ME?ME.createdAt:Date.now() };
  await sSet('profile:'+id, p, true);   // công khai cho mọi người
  await sSet('me', p, false);           // riêng thiết bị này
  ME=p;
  toast(ME?'Đã lưu hồ sơ ✿':'Đã đăng hồ sơ ✿');
  go('home');
}

/* ============ TÌM KIẾM ============ */
let searchTopic=null, searchText='';
async function renderSearch(){
  app().innerHTML=`
  <p class="eyebrow" style="text-align:center">Tìm người hợp gu</p>
  <h1 style="text-align:center;font-size:2.2rem;margin:.1em 0 .8em">Bạn đang tìm điều gì?</h1>
  <div class="panel" style="max-width:760px">
    <div class="field">
      <label>Lọc theo sở thích</label>
      <div class="chips" id="sChips">
        <span class="chip ${!searchTopic?'on':''}" data-i="">Tất cả</span>
        ${INTERESTS.map(i=>`<span class="chip ${searchTopic===i?'on':''}" data-i="${esc(i)}">${esc(i)}</span>`).join('')}
      </div>
    </div>
    <div class="two">
      <div class="field"><label>Từ khoá</label><input type="text" id="sText" value="${esc(searchText)}" placeholder="tên, công việc, khu vực…"></div>
      <div class="field"><label>Khoảng tuổi</label>
        <div style="display:flex;gap:8px;align-items:center"><input type="number" id="sMin" placeholder="từ" min="18" style="width:80px"><span style="color:var(--ink-soft)">—</span><input type="number" id="sMax" placeholder="đến" max="99" style="width:80px"></div>
      </div>
    </div>
    <button class="btn primary" id="doSearch">🔍 Tìm kiếm</button>
  </div>
  <div id="results" style="margin-top:26px"></div>`;

  $('#sChips').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    searchTopic=c.dataset.i||null;
    $('#sChips').querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
    runSearch();
  }));
  $('#doSearch').addEventListener('click',runSearch);
  $('#sText').addEventListener('keyup',e=>{ if(e.key==='Enter') runSearch(); });
  runSearch();
}
async function runSearch(){
  searchText=($('#sText')?.value||'').trim().toLowerCase();
  const min=+($('#sMin')?.value||0), max=+($('#sMax')?.value||999);
  const res=$('#results'); res.innerHTML='<div class="loading">Đang tìm…</div>';
  let list=await loadProfiles();
  list=list.filter(p=>{
    if(searchTopic && !(p.interests||[]).includes(searchTopic)) return false;
    if(min && p.age<min) return false;
    if(max<999 && p.age>max) return false;
    if(searchText){ const hay=(p.name+' '+(p.job||'')+' '+(p.area||'')+' '+(p.interests||[]).join(' ')).toLowerCase(); if(!hay.includes(searchText)) return false; }
    return true;
  });
  res.innerHTML = list.length
    ? `<div class="section-head"><h2>${list.length} kết quả</h2></div><div class="grid">${list.map(cardHTML).join('')}</div>`
    : `<div class="empty"><div class="big">🔍</div>Không tìm thấy ai khớp — thử nới rộng bộ lọc nhé.</div>`;
}

/* ============ KẾT BẠN & KẾT NỐI ============ */
async function sendReq(toId){
  if(!ME){ toast('Hãy tạo hồ sơ của bạn trước đã'); go('create'); return; }
  if(toId===ME.id){ return; }
  const key=`req:${ME.id}:${toId}`;
  const existing=j(await sGet(key),null);
  if(existing){ toast('Bạn đã gửi lời mời rồi'); return; }
  // nếu người kia đã mời mình -> khớp luôn
  const reverse=j(await sGet(`req:${toId}:${ME.id}`),null);
  if(reverse && reverse.status==='pending'){ await makeMatch(toId, ME.id); return; }
  await sSet(key,{from:ME.id,to:toId,status:'pending',at:Date.now()},true);
  toast('Đã gửi lời mời kết bạn ✉');
}

async function makeMatch(aId,bId){
  const [a,b]=[aId,bId].sort();
  const mkey=`match:${a}:${b}`;
  if(j(await sGet(mkey),null)){ return; }
  const pa=j(await sGet('profile:'+aId),{}), pb=j(await sGet('profile:'+bId),{});
  const rec={a:aId,b:bId,aName:pa.name||'?',bName:pb.name||'?',at:Date.now()};
  await sSet(mkey,rec,true);
  // đánh dấu các lời mời liên quan là đã chấp nhận
  await sSet(`req:${aId}:${bId}`,{from:aId,to:bId,status:'accepted',at:Date.now()},true);
  await sSet(`req:${bId}:${aId}`,{from:bId,to:aId,status:'accepted',at:Date.now()},true);
  // THÔNG BÁO CHO FOUNDER
  await sSet(`notif:${Date.now()}${Math.random().toString(36).slice(2,5)}`,{type:'match',...rec,read:false},true);
  await maybeEmailFounder(rec);
  toast('🎉 Kết bạn thành công! Chúc mừng nhé');
}

async function acceptReq(fromId){ await makeMatch(fromId, ME.id); render(); }
async function declineReq(fromId){ await sDel(`req:${fromId}:${ME.id}`,true); toast('Đã từ chối'); render(); }

async function renderConnect(){
  if(!ME){ app().innerHTML=`<div class="empty"><div class="big">👋</div>Hãy tạo hồ sơ trước để bắt đầu kết nối nhé.<br><br><button class="btn primary" onclick="go('create')">Tạo hồ sơ</button></div>`; return; }
  app().innerHTML=`<p class="eyebrow" style="text-align:center">Duyên của bạn</p><h1 style="text-align:center;font-size:2.2rem;margin:.1em 0 1em">Kết nối</h1><div id="cx"><div class="loading">Đang tải…</div></div>`;

  // gom lời mời & match
  const reqKeys=await sList('req:');
  const incoming=[], outgoing=[];
  for(const k of reqKeys){ const r=j(await sGet(k),null); if(!r||r.status!=='pending') continue;
    if(r.to===ME.id) incoming.push(r); else if(r.from===ME.id) outgoing.push(r); }
  const matchKeys=await sList('match:');
  const myMatches=[];
  for(const k of matchKeys){ const m=j(await sGet(k),null); if(m&&(m.a===ME.id||m.b===ME.id)) myMatches.push(m); }

  const profOf=async id=>j(await sGet('profile:'+id),{name:'?'});
  const rowReq=async(r,dir)=>{ const other=await profOf(dir==='in'?r.from:r.to);
    return `<div class="req-item"><div class="av">${avatarHTML(other)}</div>
      <div class="txt"><b>${esc(other.name)}</b><br><small>${dir==='in'?'muốn kết bạn với bạn':'bạn đã gửi lời mời — đang chờ'}</small></div>
      ${dir==='in'?`<div class="req-actions"><button class="btn primary sm" onclick="acceptReq('${r.from}')">Chấp nhận</button><button class="btn ghost sm" onclick="declineReq('${r.from}')">Từ chối</button></div>`:'<span class="tag">Đang chờ</span>'}</div>`; };
  const rowMatch=async m=>{ const oId=m.a===ME.id?m.b:m.a; const o=await profOf(oId);
    return `<div class="match-item"><div class="av">${avatarHTML(o)}</div><div class="txt"><b>${esc(o.name)}</b><br><small>Kết bạn thành công · ${new Date(m.at).toLocaleDateString('vi-VN')}</small></div><span class="match-pair"><span class="heart">❤</span></span></div>`; };

  let html='';
  html+=`<div class="section-head"><h2 style="font-size:1.4rem">💌 Lời mời đến (${incoming.length})</h2></div>`;
  html+= incoming.length? (await Promise.all(incoming.map(r=>rowReq(r,'in')))).join('') : '<div class="empty">Chưa có lời mời nào.</div>';
  html+=`<div class="section-head"><h2 style="font-size:1.4rem">📤 Lời mời đã gửi (${outgoing.length})</h2></div>`;
  html+= outgoing.length? (await Promise.all(outgoing.map(r=>rowReq(r,'out')))).join('') : '<div class="empty">Bạn chưa gửi lời mời nào.</div>';
  html+=`<div class="section-head"><h2 style="font-size:1.4rem">❤ Đã kết bạn (${myMatches.length})</h2></div>`;
  html+= myMatches.length? (await Promise.all(myMatches.map(rowMatch))).join('') : '<div class="empty">Chưa có kết nối thành công — cứ mạnh dạn gửi lời mời nhé!</div>';
  $('#cx').innerHTML=html;
}

/* ============ EMAIL CHO FOUNDER ============ */
async function maybeEmailFounder(rec){
  const email=await sGet('config:founderEmail',true);
  if(!email) return;
  // Ghi vào hàng đợi email để founder xem/gửi trong trang Founder.
  await sSet(`emailq:${rec.a}:${rec.b}`,{to:email,rec,at:Date.now(),sent:false},true);
}
function mailtoFor(email,rec){
  const subj=encodeURIComponent(`[Duyên Sở Thích] Cặp kết bạn thành công: ${rec.aName} ❤ ${rec.bName}`);
  const body=encodeURIComponent(`Xin chào Founder,\n\nVừa có một cặp kết bạn thành công trên ứng dụng:\n\n• ${rec.aName}\n• ${rec.bName}\n\nThời gian: ${new Date(rec.at).toLocaleString('vi-VN')}\n\n— Duyên Sở Thích`);
  return `mailto:${email}?subject=${subj}&body=${body}`;
}

/* ============ TRANG FOUNDER ============ */
async function renderFounder(){
  const savedPass=await sGet('config:adminPass',true);
  const unlocked=sessionUnlocked;
  if(!unlocked){
    app().innerHTML=`
    <p class="eyebrow" style="text-align:center">Khu vực quản trị</p>
    <h1 style="text-align:center;font-size:2.2rem;margin:.1em 0 1em">Đăng nhập Founder</h1>
    <div class="panel" style="max-width:420px">
      <div class="notice">🔑 ${savedPass?'Nhập mật khẩu quản trị.':'Lần đầu: hãy đặt mật khẩu quản trị cho bạn.'}</div>
      <div class="field"><label>${savedPass?'Mật khẩu':'Đặt mật khẩu mới'}</label><input type="password" id="pass" placeholder="••••••"></div>
      <button class="btn primary" id="unlock">${savedPass?'Mở khoá':'Đặt & mở khoá'}</button>
      <p class="hint" style="margin-top:12px">Lưu ý: đây là cổng bảo vệ nhẹ dành cho bản demo. Để bảo mật thật sự cho sản phẩm chính thức cần máy chủ riêng.</p>
    </div>`;
    $('#unlock').addEventListener('click',async()=>{
      const v=$('#pass').value; if(!v){toast('Nhập mật khẩu đã');return;}
      if(!savedPass){ await sSet('config:adminPass',v,true); sessionUnlocked=true; toast('Đã đặt mật khẩu'); renderFounder(); }
      else if(v===savedPass){ sessionUnlocked=true; renderFounder(); }
      else toast('Sai mật khẩu');
    });
    $('#pass').addEventListener('keyup',e=>{if(e.key==='Enter')$('#unlock').click();});
    return;
  }

  app().innerHTML=`<p class="eyebrow" style="text-align:center">Bảng điều khiển</p><h1 style="text-align:center;font-size:2.2rem;margin:.1em 0 1em">Founder</h1><div id="fx"><div class="loading">Đang tải…</div></div>`;
  const profiles=await loadProfiles();
  const matchKeys=await sList('match:'); const matches=[];
  for(const k of matchKeys){ const m=j(await sGet(k),null); if(m) matches.push(m); }
  matches.sort((a,b)=>b.at-a.at);
  const reqKeys=await sList('req:'); let pending=0;
  for(const k of reqKeys){ const r=j(await sGet(k),null); if(r&&r.status==='pending') pending++; }
  const founderEmail=await sGet('config:founderEmail',true)||'';

  const rows=matches.map(m=>`<div class="notif-item">
     <div class="txt"><b>${esc(m.aName)}</b> ❤ <b>${esc(m.bName)}</b><br><small>${new Date(m.at).toLocaleString('vi-VN')}</small></div>
     <a class="btn ghost sm" href="${mailtoFor(founderEmail||'founder@example.com',m)}">✉ Gửi email</a>
   </div>`).join('');

  $('#fx').innerHTML=`
   <div class="stat-row">
     <div class="stat"><div class="n">${profiles.length}</div><div class="l">Hồ sơ</div></div>
     <div class="stat"><div class="n">${matches.length}</div><div class="l">Cặp kết bạn</div></div>
     <div class="stat"><div class="n">${pending}</div><div class="l">Lời mời chờ</div></div>
   </div>

   <div class="panel" style="max-width:100%;margin-bottom:22px">
     <div class="field" style="margin-bottom:8px">
       <label>Email nhận thông báo của Founder</label>
       <div style="display:flex;gap:8px;flex-wrap:wrap">
         <input type="email" id="fEmail" value="${esc(founderEmail)}" placeholder="ban@congty.com" style="flex:1;min-width:200px">
         <button class="btn sage sm" id="saveEmail">Lưu email</button>
       </div>
       <p class="hint" style="margin-top:8px">Mỗi khi có cặp kết bạn thành công, hệ thống ghi lại bên dưới. Bấm <b>Gửi email</b> để soạn thư báo tới địa chỉ này. (Xem ghi chú của em bên dưới về cách gửi hoàn toàn tự động.)</p>
     </div>
   </div>

   <div class="section-head"><h2 style="font-size:1.4rem">🔔 Nhật ký kết bạn thành công</h2>
     ${matches.length?`<button class="btn ghost sm" id="expBtn">⬇ Tải dữ liệu (JSON)</button>`:''}</div>
   ${matches.length? rows : '<div class="empty"><div class="big">🔔</div>Chưa có cặp nào kết bạn thành công.</div>'}

   <div style="margin-top:22px;text-align:center"><button class="btn ghost sm" id="lockBtn">Khoá lại</button></div>`;

  $('#saveEmail').addEventListener('click',async()=>{ await sSet('config:founderEmail',$('#fEmail').value.trim(),true); toast('Đã lưu email founder'); });
  $('#lockBtn').addEventListener('click',()=>{ sessionUnlocked=false; renderFounder(); });
  if($('#expBtn')) $('#expBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),matches,profiles},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='duyen-so-thich-data.json'; a.click();
  });
}
let sessionUnlocked=false;

/* ============ KHỞI ĐỘNG ============ */
(async function init(){
  ME=j(await sGet('me',false),null);
  render();
})();
</script>
